spring:
  application:
    name: forge-ai

server:
  port: ${PORT:8080}
  shutdown: graceful

# Only health is exposed. The full actuator surface (env, beans, configprops, heapdump, loggers...)
# discloses configuration and internals and must not be public — this project's security rules name
# "exposed management endpoints" explicitly. show-details is "never" so an unauthenticated caller
# gets liveness/readiness without a component-by-component map of the system's dependencies.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

forge:
  workspace:
    # The only directory tree the API may scan. Every requested repository path is resolved beneath
    # it; absolute paths and traversal outside it are rejected (WorkspacePathResolver). Defaults to
    # the process working directory; override with FORGE_WORKSPACE_ROOT in a deployed environment.
    root: ${FORGE_WORKSPACE_ROOT:}
