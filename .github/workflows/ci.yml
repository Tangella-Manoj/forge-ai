name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: |
          ./mvnw -B clean verify

  docker-build:
    # Validates the Dockerfile actually produces a runnable image on every push/PR. Build-only —
    # no registry push here. Pushing to a registry needs a chosen registry and credentials, neither
    # of which has been decided yet; adding that step now would be speculative infrastructure.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t forge-ai:ci .
      - name: Start container and verify health
        run: |
          docker run -d --name forge-ai-ci -p 8080:8080 forge-ai:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy in time"
          docker logs forge-ai-ci
          exit 1
      - name: Verify sensitive actuator endpoints stay non-public
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/env)
          if [ "$status" != "404" ]; then
            echo "Expected /actuator/env to 404, got $status"
            exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs forge-ai-ci || true
